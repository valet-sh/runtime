name: 'build'

on:
  push:
    branches:
      - master

jobs:
  test-build:
    name: test-build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu_jammy-x86_64
            os: ubuntu-22.04
            python_version: '3.10'

          - name: ubuntu_noble-x86_64
            os: ubuntu-24.04
            python_version: '3.12'

          - name: macos-x86_64
            os: macos-15-intel
            python_version: '3.12'

          - name: macos-arm64
            os: macos-15
            python_version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - run: bash ${GITHUB_WORKSPACE}/build.sh
