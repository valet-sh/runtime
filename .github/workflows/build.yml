name: 'build'

on:
  push:
    branches:
      - 3.x

jobs:
  test-build-ubuntu-2404:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ${GITHUB_WORKSPACE}/build.sh
  test-build-ubuntu-2604:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ${GITHUB_WORKSPACE}/build.sh
  test-build-macos-15:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash ${GITHUB_WORKSPACE}/build.sh
  test-build-macos-26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: bash ${GITHUB_WORKSPACE}/build.sh
